[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "printclr"
version = "1.0.1"
authors = [
  { name="Plum", email="plumlulz@protonmail.com" },
]
description = "Simple print color package."
readme = "README.md"
requires-python = ">=3.6"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]
keywords = ["print color", "print", "color", "colored"]

[project.urls]
Homepage = "https://github.com/PlumLulz/printclr"
Issues = "https://github.com/PlumLulz/printclr/issues"
